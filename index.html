<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // DECRYPTION</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0d11;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .terminal {
            background: rgba(10, 15, 20, 0.95);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .binary-code {
            word-break: break-all;
            font-size: 13px;
            color: #ff0055;
            background: #000;
            padding: 12px;
            border: 1px dashed #ff0055;
            margin: 20px 0;
            line-height: 1.5;
        }
        .btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
        .result {
            margin-top: 25px;
            font-size: 26px;
            font-weight: bold;
            min-height: 35px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            letter-spacing: 3px;
        }
        .sub-text {
            font-size: 12px;
            color: #668888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div style="font-size: 12px; color: #888;">[ SYSTEM STATUS: ENCRYPTED ]</div>
    <h3 style="margin: 10px 0;">AUTHOR IDENTITY LOCKED</h3>
    
    <div class="binary-code">
        01000001 01100100 01100001 01101101 00100000 01001101 01100001 01100101 01110010
    </div>

    <button class="btn" id="decryptBtn">[ DECRYPT ]</button>

    <div class="result" id="output"></div>
    <div class="sub-text" id="status">Нажмите для запуска расшифровки...</div>
</div>

<script>
    document.getElementById("decryptBtn").addEventListener("click", function() {
        const targetText = "ADAM MAER";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const output = document.getElementById("output");
        const status = document.getElementById("status");
        let iterations = 0;

        status.innerText = "Расшифровка матрицы...";
        
        const interval = setInterval(() => {
            output.innerText = targetText
                .split("")
                .map((char, index) => {
                    if (char === " ") return " ";
                    if (index < iterations) return targetText[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                })
                .join("");

            if (iterations >= targetText.length) {
                clearInterval(interval);
                status.innerText = "ACCESS GRANTED // WELCOME TO CEREBRION";
                status.style.color = "#00ffcc";
            }

            iterations += 1 / 3;
        }, 50);
    });
</script>

</body>
</html>
